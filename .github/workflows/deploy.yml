
name: Deploy FitZone

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::254618531962:role/FitZoneGitHubActionsRole
          aws-region: us-west-2

      - name: Deploy to S3
        run: aws s3 sync dist/ s3://fitzone-suphin-2026 --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id E2FPM31ST6OX0Z --paths "/*"
